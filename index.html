!DOCTYPE html>

<html lang="es">
<head>
<meta charset="UTF-8">
<title>Lunaria</title>
<style>
body {
    margin: 0;
    font-family: Arial;
    background: #0b0b0b;
    color: white;
}

header {
text-align: center;
padding: 30px;
font-size: 30px;
letter-spacing: 5px;
}

.container {
display: grid;
grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
gap: 20px;
padding: 40px;
}

.card {
background: #111;
padding: 20px;
border-radius: 15px;
text-align: center;
transition: 0.3s;
}

.card:hover {
transform: scale(1.05);
}

.card img {
width: 100%;
border-radius: 10px;
}

.price {
margin: 10px 0;
}

button {
padding: 10px 20px;
border: none;
background: white;
cursor: pointer;
}

#cart {
position: fixed;
top: 20px;
right: 20px;
background: white;
color: black;
padding: 10px;
border-radius: 10px;
} </style>

</head>

<body>

<header>LUNARIA ✨</header>

<div id="cart">🛒 0</div>

<div class="container">

<div class="card">
<img src="https://via.placeholder.com/300">
<h2>Anillo Luna</h2>
<p>Plata 925 minimalista</p>
<p class="price">$79.900</p>
<button onclick="addToCart('Anillo Luna',79900)">Agregar</button>
</div>

<div class="card">
<img src="https://via.placeholder.com/300">
<h2>Collar Estrella</h2>
<p>Plata 925</p>
<p class="price">$94.900</p>
<button onclick="addToCart('Collar Estrella',94900)">Agregar</button>
</div>

</div>

<button onclick="buy()" style="margin:40px;">Finalizar compra</button>

<script>
let cart = [];
let total = 0;

function addToCart(name, price){
    cart.push(name);
    total += price;
    document.getElementById("cart").innerText = "🛒 " + cart.length;
}

function buy(){
    let message = "Hola, quiero comprar:%0A";
    cart.forEach(p => message += "- " + p + "%0A");
    message += "Total: $" + total;

    window.open("https://wa.me/573022186456?text=" + message);
}
</script>

</body>
</html>
